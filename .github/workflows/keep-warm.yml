# Держит бэкенд тёплым, пока он живёт на бесплатном тарифе Render.
#
# Render free останавливает инстанс после ~15 минут без запросов, и следующий
# клиент ждёт холодный старт 30–60 секунд. Пинг каждые 10 минут этого не
# допускает.
#
# ПОЧЕМУ ЭТОТ ФАЙЛ ЗДЕСЬ, А НЕ В РЕПОЗИТОРИИ БЭКЕНДА: у публичных репозиториев
# минуты GitHub Actions не тарифицируются, а photostudio-backend приватный —
# там 144 запуска в сутки съели бы весь бесплатный лимит.
#
# ПОЧЕМУ ?shallow=1: этот путь намеренно НЕ ходит в базу. Обычный /health делает
# SELECT 1, а любой запрос будит вычислитель Neon — пинг каждые 10 минут не дал
# бы базе заснуть и сжёг бы её бесплатную квоту компьюта. То есть лечил бы одну
# проблему тарифа, создавая вторую.
#
# ЭТО ВРЕМЕННАЯ ПОДПОРКА. После перехода на платный Render workflow нужно
# удалить — см. photostudio-backend/docs/SCALING.md, шаг «Выключить костыли».

name: keep-warm

on:
  schedule:
    # Каждые 10 минут. GitHub не гарантирует точность расписания и может
    # задержать запуск под нагрузкой — для этой задачи это допустимо.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Если предыдущий запуск ещё идёт (холодный старт бывает долгим) — не копим
# очередь параллельных пингов.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Разбудить бэкенд
        run: |
          URL="https://photostudio-backend-yehh.onrender.com/health?shallow=1"
          # --retry: первый запрос после сна может не дождаться старта инстанса.
          # --max-time 90 с запасом покрывает холодный старт Render free.
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
                   --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
                   "$URL")
          echo "HTTP $code"
          cat /tmp/body.txt
          echo
          if [ "$code" != "200" ]; then
            echo "::error::бэкенд не ответил 200 (получено $code)"
            exit 1
          fi
